<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Lupa UFVAI: lente + cabo diagonal + rede de nós da pesquisa (símbolo do PesquisAI original,
       repintado com as cores UFVAI: azul profundo #1f2831 + dourado #b29149/#d4b56a) -->
  <defs>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4b56a"/>
      <stop offset="100%" stop-color="#8f7536"/>
    </linearGradient>
  </defs>

  <!-- Lente da lupa -->
  <circle cx="92" cy="92" r="48" fill="#1f2831"/>
  <circle cx="92" cy="92" r="48" fill="none" stroke="url(#lens)" stroke-width="6"/>

  <!-- Cabo da lupa -->
  <line x1="127" y1="127" x2="166" y2="166" stroke="url(#lens)" stroke-width="10" stroke-linecap="round"/>

  <!-- Rede de nós da pesquisa dentro da lente -->
  <g stroke="#b29149" stroke-width="1.6" opacity="0.85">
    <line x1="76" y1="78" x2="96" y2="74"/>
    <line x1="76" y1="78" x2="90" y2="92"/>
    <line x1="76" y1="78" x2="70" y2="96"/>
    <line x1="96" y1="74" x2="110" y2="88"/>
    <line x1="96" y1="74" x2="90" y2="92"/>
    <line x1="110" y1="88" x2="106" y2="106"/>
    <line x1="110" y1="88" x2="90" y2="92"/>
    <line x1="106" y1="106" x2="88" y2="110"/>
    <line x1="106" y1="106" x2="90" y2="92"/>
    <line x1="88" y1="110" x2="70" y2="96"/>
    <line x1="88" y1="110" x2="90" y2="92"/>
    <line x1="70" y1="96" x2="90" y2="92"/>

    <line x1="76" y1="78" x2="82" y2="86"/>
    <line x1="96" y1="74" x2="82" y2="86"/>
    <line x1="70" y1="96" x2="82" y2="86"/>
    <line x1="90" y1="92" x2="82" y2="86"/>
    <line x1="110" y1="88" x2="102" y2="100"/>
    <line x1="106" y1="106" x2="102" y2="100"/>
    <line x1="90" y1="92" x2="102" y2="100"/>
    <line x1="82" y1="86" x2="102" y2="100"/>
  </g>

  <!-- Nós (vértices da rede) -->
  <circle cx="90" cy="92" r="5.5" fill="#d4b56a"/>
  <circle cx="76" cy="78" r="4.5" fill="#b29149"/>
  <circle cx="96" cy="74" r="4.5" fill="#b29149"/>
  <circle cx="110" cy="88" r="4.5" fill="#b29149"/>
  <circle cx="106" cy="106" r="4.5" fill="#b29149"/>
  <circle cx="88" cy="110" r="4.5" fill="#b29149"/>
  <circle cx="70" cy="96" r="4.5" fill="#b29149"/>
  <circle cx="82" cy="86" r="4" fill="#c9a54f"/>
  <circle cx="102" cy="100" r="4" fill="#c9a54f"/>
</svg>
